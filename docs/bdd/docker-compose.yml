services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./creation.sql:/docker-entrypoint-initdb.d/creation.sql
    networks:
      - agriflow-network

volumes:
  db_data:

networks:
  agriflow-network:
    driver: bridge
